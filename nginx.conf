server {
    listen ${PORT} default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"expediente-venezuela"}';
    }

    location = /expediente-venezuela {
        return 301 /expediente-venezuela/;
    }

    location ^~ /expediente-venezuela/ {
        rewrite ^/expediente-venezuela/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|json|svg|jpg|jpeg|png|webp|ico|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
